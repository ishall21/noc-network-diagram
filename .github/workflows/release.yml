name: Publish GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release archive
        run: |
          zip -r noc-network-diagram-${GITHUB_REF_NAME}.zip . \
            -x ".git/*" ".github/*" "*.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "NOC Network Diagram Studio ${{ github.ref_name }}"
          generate_release_notes: true
          files: noc-network-diagram-${{ github.ref_name }}.zip
